name: Check Gemini PR Review Comments

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: string
      timeout:
        description: 'Polling timeout in seconds'
        required: false
        default: '300'
        type: string
      poll_interval:
        description: 'Seconds between polls'
        required: false
        default: '30'
        type: string

jobs:
  check-gemini-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check for Gemini review comments
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          TIMEOUT="${{ github.event.inputs.timeout || '300' }}"
          INTERVAL="${{ github.event.inputs.poll_interval || '30' }}"
          echo "Checking PR #$PR_NUM for Gemini review comments..."
          python scripts/ci/check_gemini_reviews.py \
            --pr-number "$PR_NUM" \
            --timeout "$TIMEOUT" \
            --poll-interval "$INTERVAL" \
            --output gemini_comments.json || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-review-comments-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          path: |
            gemini_comments.json
            gemini_comments_summary.txt
          if-no-files-found: ignore

      - name: Read results
        if: always()
        id: results
        run: |
          if [ -f gemini_comments.json ]; then
            echo "json_exists=true" >> "$GITHUB_OUTPUT"
            COUNT=$(python -c "import json; d=json.load(open('gemini_comments.json')); print(d.get('summary',{}).get('total',0))")
            echo "comment_count=$COUNT" >> "$GITHUB_OUTPUT"
            STATUS=$(python -c "import json; d=json.load(open('gemini_comments.json')); print(d.get('status','unknown'))")
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "json_exists=false" >> "$GITHUB_OUTPUT"
            echo "comment_count=0" >> "$GITHUB_OUTPUT"
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Post summary comment on PR
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🤖 Gemini Review Check\n\n';
            
            const status = '${{ steps.results.outputs.status }}';
            const count = parseInt('${{ steps.results.outputs.comment_count }}', 10);
            
            if (status === 'found') {
              body += `✅ **Found ${count} Gemini comment(s).**\n\n`;
              body += 'OpenCode can now review and address these comments.\n\n';
              body += '<details>\n<summary>View raw JSON results</summary>\n\n```json\n';
              try {
                const data = fs.readFileSync('gemini_comments.json', 'utf8');
                body += data;
              } catch (e) {
                body += 'Error reading results: ' + e.message;
              }
              body += '\n```\n</details>';
            } else if (status === 'timeout') {
              body += '⏱️ **Timeout:** No Gemini comments found within the polling window.\n\n';
              body += 'This may mean Gemini has not yet reviewed the PR, or there are no comments.';
            } else {
              body += '❌ **Error or no comments found.**\n\n';
              body += 'Check workflow logs for details.';
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail if comments require action
        if: steps.results.outputs.status == 'found' && steps.results.outputs.comment_count != '0'
        run: |
          echo "Gemini comments found. Review the output above or download the artifact."
          # Do not fail the workflow; leave it as a signal for OpenCode
          exit 0
